
<style>
  * { box-sizing: border-box; }
  :root {
    --color-text-primary: #eff5ff;
    --color-text-secondary: #b5c6e6;
    --color-text-tertiary: #9db2d9;
  }
  body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    color: #e9f0ff;
    background:
      radial-gradient(1200px 650px at 0% 0%, #1c3458 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 100%, #153843 0%, transparent 60%),
      linear-gradient(135deg, #0d121f 0%, #121d32 48%, #101727 100%);
    padding: 0 10px 12px;
  }
  .page-title {
    margin: 18px 0 12px;
    text-align: center;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: #f2f7ff;
  }
  .app-shell {
    width: calc(100vw - 20px);
    max-width: none;
    min-height: calc(100vh - 110px);
    margin: 0 auto;
    padding: 20px;
    border: 1px solid #283754;
    border-radius: 14px;
    background: rgba(14, 21, 36, 0.88);
    backdrop-filter: blur(4px);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
  }
  .tab-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .tab-btn {
    padding: 10px 18px;
    border: 1px solid #33486d;
    border-radius: 10px;
    background: linear-gradient(180deg, #1a2842 0%, #141f33 100%);
    color: #d7e4ff;
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .tab-btn:hover { border-color: #4d79c8; transform: translateY(-1px); }
  .tab-btn.active {
    background: linear-gradient(135deg, #2d74d7 0%, #1f9f8a 100%);
    color: #fff;
    border-color: #66cdbd;
    box-shadow: 0 6px 16px rgba(22, 98, 198, 0.35);
  }
  .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .meta-card {
    background: linear-gradient(180deg, rgba(34, 47, 74, 0.92) 0%, rgba(21, 31, 49, 0.92) 100%);
    border-radius: 10px;
    border: 1px solid #314364;
    padding: 10px 14px;
  }
  .meta-label { font-size: 13px; color: #9eb1d8; margin-bottom: 3px; }
  .meta-val { font-size: 19px; font-weight: 700; color: #eff5ff; }
  .group-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .group-card {
    border: 1px solid #2e3f60;
    border-radius: 12px;
    overflow: hidden;
    background: rgba(18, 26, 42, 0.95);
  }
  .group-header { padding: 12px 14px; font-size: 15px; font-weight: 700; }
  .ctrl-header { background: linear-gradient(135deg, #1c5d53 0%, #1f7464 100%); color: #effffb; }
  .exp-header { background: linear-gradient(135deg, #22529a 0%, #2a7cbc 100%); color: #f3f8ff; }
  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  th {
    padding: 12px 12px;
    text-align: left;
    background: #1d2a44;
    color: #c8d8f8;
    font-weight: 600;
    border-bottom: 1px solid #314462;
    font-size: 14px;
  }
  td {
    padding: 11px 12px;
    border-bottom: 1px solid #2c3d5d;
    color: #e8efff;
    background: rgba(20, 29, 46, 0.9);
  }
  tr:nth-child(even) td { background: rgba(16, 24, 38, 0.95); }
  tr:last-child td { border-bottom: none; }
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 14px;
    background: #1a263d;
    font-size: 15px;
    border-top: 1px solid #314462;
  }
  .stat-label { color: #9db0d7; }
  .stat-val { font-weight: 600; color: #eff5ff; }
  .hyp-box {
    border: 1px solid #304261;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 15px;
    color: #bfd0f0;
    line-height: 1.6;
    background: linear-gradient(180deg, rgba(31, 44, 69, 0.92) 0%, rgba(19, 28, 45, 0.92) 100%);
  }
  .note { font-size: 13px; color: #9bb0d8; margin-top: 14px; }
  @media (max-width: 980px) {
    .group-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 900px) {
    .page-title { font-size: 28px; }
    .app-shell {
      width: calc(100vw - 12px);
      min-height: auto;
      padding: 12px;
    }
    table { font-size: 13px; }
    th { font-size: 12px; }
    td { font-size: 13px; }
  }
</style>

<h1 class="page-title">Sample Data For Three Hypothesis Testing Topics</h1>

<div class="app-shell" style="padding: 1rem 0;">

<div class="tab-row">
  <button class="tab-btn active" onclick="show(0)">Topic 1: Sleep &amp; Memory</button>
  <button class="tab-btn" onclick="show(1)">Topic 2: Fertilizer &amp; Crop Yield</button>
  <button class="tab-btn" onclick="show(2)">Topic 3: Headphones &amp; Focus</button>
</div>

<div id="content"></div>

</div>

<script>
const topics = [
  {
    title: "Sleep & Memory Recall",
    unit: "words recalled (out of 30)",
    h0: "H₀: There is no significant difference in memory recall between participants sleeping 6h vs 8h per night.",
    h1: "H₁: Participants sleeping 8h recall significantly more words than those sleeping 6h.",
    ctrlLabel: "Control group — 6 hours sleep",
    expLabel:  "Experiment group — 8 hours sleep",
    ctrlDesc:  "Participants slept their usual 6h/night for 2 weeks, then took a 30-word recall test.",
    expDesc:   "Participants extended sleep to 8h/night for 2 weeks, then took the same 30-word recall test.",
    ctrlCol: "Words recalled",
    expCol:  "Words recalled",
    ctrl: [
      ["P01","Male","22",17],["P02","Female","24",19],["P03","Male","21",16],["P04","Female","23",18],
      ["P05","Male","25",20],["P06","Female","22",15],["P07","Male","23",18],["P08","Female","24",17],
      ["P09","Male","21",19],["P10","Female","22",16],["P11","Male","24",18],["P12","Female","23",17],
      ["P13","Male","22",20],["P14","Female","21",15],["P15","Male","25",19],["P16","Female","22",18],
    ],
    exp: [
      ["P17","Male","22",23],["P18","Female","24",25],["P19","Male","21",22],["P20","Female","23",24],
      ["P21","Male","25",26],["P22","Female","22",21],["P23","Male","23",24],["P24","Female","24",23],
      ["P25","Male","21",25],["P26","Female","22",22],["P27","Male","24",24],["P28","Female","23",23],
      ["P29","Male","22",26],["P30","Female","21",21],["P31","Male","25",25],["P32","Female","22",24],
    ],
  },
  {
    title: "Fertilizer & Crop Yield",
    unit: "yield in kg/acre",
    h0: "H₀: Organic fertilizer does not produce a significantly different rice yield compared to conventional fertilizer.",
    h1: "H₁: Organic fertilizer produces a significantly higher rice yield than conventional fertilizer.",
    ctrlLabel: "Control group — conventional fertilizer",
    expLabel:  "Experiment group — organic fertilizer",
    ctrlDesc:  "Plots treated with standard NPK chemical fertilizer. Yield measured after one full growth cycle.",
    expDesc:   "Plots treated with compost-based organic fertilizer at equivalent nutrient levels. Same growth cycle.",
    ctrlCol: "Yield (kg/acre)",
    expCol:  "Yield (kg/acre)",
    ctrl: [
      ["Plot 01","Clay","North",310],["Plot 02","Loam","South",325],["Plot 03","Sandy","East",308],["Plot 04","Loam","West",320],
      ["Plot 05","Clay","North",315],["Plot 06","Sandy","South",305],["Plot 07","Loam","East",328],["Plot 08","Clay","West",318],
      ["Plot 09","Sandy","North",312],["Plot 10","Loam","South",322],["Plot 11","Clay","East",316],["Plot 12","Sandy","West",307],
      ["Plot 13","Loam","North",330],["Plot 14","Clay","South",313],["Plot 15","Sandy","East",309],["Plot 16","Loam","West",324],
    ],
    exp: [
      ["Plot 17","Clay","North",338],["Plot 18","Loam","South",352],["Plot 19","Sandy","East",333],["Plot 20","Loam","West",348],
      ["Plot 21","Clay","North",341],["Plot 22","Sandy","South",330],["Plot 23","Loam","East",355],["Plot 24","Clay","West",343],
      ["Plot 25","Sandy","North",336],["Plot 26","Loam","South",349],["Plot 27","Clay","East",340],["Plot 28","Sandy","West",331],
      ["Plot 29","Loam","North",358],["Plot 30","Clay","South",337],["Plot 31","Sandy","East",332],["Plot 32","Loam","West",350],
    ],
  },
  {
    title: "Noise-Cancelling Headphones & Focus",
    unit: "task completion time in minutes",
    h0: "H₀: Using noise-cancelling headphones does not significantly reduce task completion time.",
    h1: "H₁: Participants using noise-cancelling headphones complete tasks significantly faster.",
    ctrlLabel: "Control group — no headphones",
    expLabel:  "Experiment group — noise-cancelling headphones",
    ctrlDesc:  "Participants worked in an open office environment with ambient noise and no headphones.",
    expDesc:   "Participants used noise-cancelling headphones in the same open office while completing identical tasks.",
    ctrlCol: "Time (min)",
    expCol:  "Time (min)",
    ctrl: [
      ["P01","Male","26",44],["P02","Female","28",41],["P03","Male","30",45],["P04","Female","27",43],
      ["P05","Male","29",46],["P06","Female","25",40],["P07","Male","31",42],["P08","Female","28",44],
      ["P09","Male","26",45],["P10","Female","29",41],["P11","Male","27",43],["P12","Female","30",46],
      ["P13","Male","28",42],["P14","Female","26",44],["P15","Male","31",45],["P16","Female","27",43],
    ],
    exp: [
      ["P17","Male","26",37],["P18","Female","28",35],["P19","Male","30",38],["P20","Female","27",36],
      ["P21","Male","29",34],["P22","Female","25",36],["P23","Male","31",35],["P24","Female","28",37],
      ["P25","Male","26",34],["P26","Female","29",36],["P27","Male","27",35],["P28","Female","30",33],
      ["P29","Male","28",36],["P30","Female","26",35],["P31","Male","31",34],["P32","Female","27",36],
    ],
  },
];

function avg(arr) { return (arr.reduce((a,b) => a+b, 0) / arr.length).toFixed(2); }
function sd(arr) {
  const m = arr.reduce((a,b)=>a+b,0)/arr.length;
  return Math.sqrt(arr.reduce((a,b)=>a+(b-m)**2,0)/arr.length).toFixed(2);
}

function show(i) {
  document.querySelectorAll('.tab-btn').forEach((b,j) => b.classList.toggle('active', j===i));
  const t = topics[i];
  const col3Label = i===1 ? "Soil" : "Gender";
  const col4Label = i===1 ? "Location" : "Age";

  const ctrlVals = t.ctrl.map(r=>r[3]);
  const expVals  = t.exp.map(r=>r[3]);

  const rows = (data, col) => data.map(r =>
    `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td style="font-weight:500;">${r[3]}</td></tr>`
  ).join('');

  document.getElementById('content').innerHTML = `
    <div class="hyp-box">
      <div style="margin-bottom:4px;"><strong style="color:var(--color-text-primary);">H₀:</strong> ${t.h0.replace('H₀: ','')}</div>
      <div><strong style="color:var(--color-text-primary);">H₁:</strong> ${t.h1.replace('H₁: ','')}</div>
    </div>

    <div class="meta-grid">
      <div class="meta-card"><div class="meta-label">Total participants / plots</div><div class="meta-val">32 (16 per group)</div></div>
      <div class="meta-card"><div class="meta-label">Measurement unit</div><div class="meta-val">${t.unit}</div></div>
      <div class="meta-card"><div class="meta-label">Test type</div><div class="meta-val">Two-tailed Z-test</div></div>
      <div class="meta-card"><div class="meta-label">Significance level</div><div class="meta-val">α = 0.05</div></div>
    </div>

    <div class="group-grid">
      <div class="group-card">
        <div class="group-header ctrl-header">${t.ctrlLabel}</div>
        <div style="padding:8px 14px 6px;font-size:11px;color:var(--color-text-secondary);">${t.ctrlDesc}</div>
        <table>
          <thead><tr><th>ID</th><th>${col3Label}</th><th>${col4Label}</th><th>${t.ctrlCol}</th></tr></thead>
          <tbody>${rows(t.ctrl)}</tbody>
        </table>
        <div class="stat-row"><span class="stat-label">Mean</span><span class="stat-val">${avg(ctrlVals)}</span></div>
        <div class="stat-row"><span class="stat-label">Std dev</span><span class="stat-val">${sd(ctrlVals)}</span></div>
        <div class="stat-row"><span class="stat-label">n</span><span class="stat-val">16</span></div>
      </div>

      <div class="group-card">
        <div class="group-header exp-header">${t.expLabel}</div>
        <div style="padding:8px 14px 6px;font-size:11px;color:var(--color-text-secondary);">${t.expDesc}</div>
        <table>
          <thead><tr><th>ID</th><th>${col3Label}</th><th>${col4Label}</th><th>${t.expCol}</th></tr></thead>
          <tbody>${rows(t.exp)}</tbody>
        </table>
        <div class="stat-row"><span class="stat-label">Mean</span><span class="stat-val">${avg(expVals)}</span></div>
        <div class="stat-row"><span class="stat-label">Std dev</span><span class="stat-val">${sd(expVals)}</span></div>
        <div class="stat-row"><span class="stat-label">n</span><span class="stat-val">16</span></div>
      </div>
    </div>
    <p class="note">Each row is one participant / plot. Mean and SD are computed from the 16 data points shown and feed directly into the Z-test table.</p>
  `;
}

show(0);
</script>
